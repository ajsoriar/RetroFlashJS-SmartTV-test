<!DOCTYPE html>
<html>

<head>
    <title>Test RetroFlashJS</title>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="css/styles.css">

    <script type="text/javascript">
        if (window.webOS && webOS.service) {
            webOS.service.request("luna://com.palm.systemservice", {
                method: "clock/getTime",
                parameters: {},
                onSuccess: function (args) {
                    console.log("UTC:", args.utc);
                },
                onFailure: function (args) {
                    console.log("Failed to getTime");
                }
            });
        }
    </script>

    <script src="./libs/retroflash-1.1.2.min.js"></script>

</head>

<body class="my-body simple-graphics">

    <!-- The movie fills the window; RetroFlash.js fits the stage into it by the scale parameter. -->
    <object id="retroflashMovie" data="./swf/test_3.swf" type="application/x-shockwave-flash" width="100%" height="100%">
        <param name="movie" value="./swf/test_3.swf">
        <param name="quality" value="high">
        <param name="scale" value="showall">
    </object>

    <script src="./js/main.js"></script>

</body>

</html>
