<!DOCTYPE html>
<html>

<head>
    <title>Test RetroFlashJS</title>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="css/styles.css">

    <script type="text/javascript">
        webOS.service.request("luna://com.palm.systemservice", {
            method: "clock/getTime",
            parameters: {},
            onSuccess: function (args) {
                console.log("UTC:", args.utc);
            },
            onFailure: function (args) {
                console.log("Failed to getTime");
            }
        });
    </script>

    <script src="./libs/retroflashjs.js"></script>

</head>

<body class="my-body simple-graphics">

    <object data="./swf/test1.swf" type="application/x-shockwave-flash" width="1920" height="1080">
        <param name="movie" value="./swf/test1.swf">
        <param name="quality" value="high">
    </object>

    <script src="./js/main.js"></script>

</body>

</html>
